name: Deploy AI Quiz Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/generate-ai-test/**"
      - "supabase/functions/translate-test-mcq/**"
      - ".github/workflows/deploy-ai-quiz.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ejlgobrbajobdbcjodhr
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify function source
        run: test -f supabase/functions/generate-ai-test/index.ts
      - name: Deploy AI generation and translation functions
        run: |
          supabase functions deploy generate-ai-test --project-ref "$PROJECT_ID" --use-api
          supabase functions deploy translate-test-mcq --project-ref "$PROJECT_ID" --use-api
