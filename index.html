<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Learning Tracker</title>
<meta name="description" content="Team learning tracker with private playlists, progress and leaderboard.">

<style>
:root{--bg:#f6f7fb;--surface:#fff;--surface2:#f0f2f8;--line:#e1e4ed;--text:#171927;--muted:#687087;--accent:#5b5bd6;--accent2:#8b5cf6;--good:#159b79;--bad:#d9534f;--r:16px;--shadow:0 8px 28px rgba(20,24,50,.07)}
:root[data-theme=dark]{--bg:#0d0f18;--surface:#161927;--surface2:#1e2233;--line:#2b3044;--text:#eef0fb;--muted:#9da4bf;--accent:#8b8bff;--accent2:#b48bff;--good:#34d3a6;--bad:#ff7772;--shadow:0 8px 28px rgba(0,0,0,.28)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0f18;--surface:#161927;--surface2:#1e2233;--line:#2b3044;--text:#eef0fb;--muted:#9da4bf;--accent:#8b8bff;--accent2:#b48bff;--good:#34d3a6;--bad:#ff7772;--shadow:0 8px 28px rgba(0,0,0,.28)}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:var(--accent)}
.wrap{width:min(100%,1050px);margin:auto;padding:16px 14px 72px}.top{display:flex;gap:10px;align-items:center;margin-bottom:14px;min-height:44px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:800}.brand h1{font-size:18px;margin:0}.sub{font-size:11px;color:var(--muted)}.spacer{flex:1}.me{display:flex;align-items:center;gap:7px}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}.me .name{font-weight:650;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}.stack>*+*{margin-top:12px}.grid{display:grid;gap:12px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
h2,h3{margin:0 0 5px;line-height:1.25}h2{font-size:20px}h3{font-size:15px}.muted,.hint{color:var(--muted)}.hint{font-size:12px}.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:750;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow:auto;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:12px;margin:14px 0;box-shadow:var(--shadow)}.tabs button{border:0;background:none;color:var(--muted);padding:9px 13px;border-radius:9px;font-weight:650;white-space:nowrap;min-width:100px}.tabs button.active{background:var(--surface2);color:var(--text)}
input,textarea,select{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none}textarea{min-height:150px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}.field{margin-bottom:12px}
.btn{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:10px 14px;font-weight:700}.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}.right{margin-left:auto}.notice{padding:10px 12px;border-radius:10px;background:var(--surface2);color:var(--muted);font-size:13px}.notice.bad{border-left:3px solid var(--bad)}
.stats{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:10px}.stat{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px}.stat strong{font-size:22px}.progress{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.list{display:grid;gap:10px}.item{border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:14px}.item.click{cursor:pointer}.item.click:hover{border-color:var(--accent)}.itemhead{display:flex;gap:12px;align-items:flex-start}.grow{flex:1;min-width:0}.meta{font-size:12px;color:var(--muted)}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:3px 8px;font-size:11px;color:var(--muted)}.pill.admin{color:var(--accent)}
.video{display:flex;gap:9px;align-items:flex-start;padding:11px 2px;border-top:1px solid var(--line)}.video:first-child{border-top:0}.video input{width:19px;height:19px;padding:0;accent-color:var(--accent);flex:none}.video.done .vtitle{text-decoration:line-through;color:var(--muted)}.vtitle{flex:1;min-width:0}.video a{font-size:12px;text-decoration:none}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:7px}td{padding:10px 7px;border-top:1px solid var(--line)}tr.me-row td{background:var(--surface2)}
.auth{max-width:440px;margin:7vh auto}.auth .logo2{margin-bottom:12px}.switch{display:flex;background:var(--surface2);padding:3px;border-radius:10px;margin:15px 0}.switch button{flex:1;border:0;background:none;padding:8px;border-radius:8px;color:var(--muted);font-weight:700}.switch button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:14px;z-index:20}.modal>div{width:min(100%,520px);max-height:90vh;overflow:auto}
.empty{text-align:center;padding:35px 10px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 15px;border-radius:999px;font-weight:700;font-size:13px;z-index:30;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:.95}
@media(max-width:700px){.wrap{padding:12px 10px 60px}.me .name{display:none}.stats{grid-template-columns:1fr 1fr}.stats .wide{grid-column:1/-1}.two,.three{grid-template-columns:1fr}.card{padding:14px}.tabs button{min-width:90px}.top{margin-bottom:10px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand"><div class="logo">LT</div><div><h1>Learning Tracker</h1><div class="sub">Learn together · track progress · grow</div></div></div>
  <div class="spacer"></div><div id="me"></div>
</header>
<div id="root"></div>
</div>
<div id="toast" class="toast"></div>
<script>
"use strict";
const SUPABASE_URL="https://ejlgobrbajobdbcjodhr.supabase.co";
const SUPABASE_KEY="sb_publishable_Y1qSvfxdjUUpIzH6USAl2g_di7FwICk";
if(!window.supabase){document.getElementById("root").innerHTML='<div class="card notice bad"><b>App could not start.</b><div style="margin-top:6px">The Supabase client library did not load. Refresh the page and check that CDN scripts are not blocked.</div></div>';throw new Error("Supabase client library failed to load")}let db=null;let supabaseReady=null;function loadSupabase(){if(window.supabase)return Promise.resolve(window.supabase);if(supabaseReady)return supabaseReady;supabaseReady=new Promise((resolve,reject)=>{const urls=["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2","https://unpkg.com/@supabase/supabase-js@2"];let i=0;const next=()=>{if(window.supabase)return resolve(window.supabase);if(i>=urls.length)return reject(new Error("Could not load the Supabase client library."));const s=document.createElement("script");s.src=urls[i++];s.onload=()=>window.supabase?resolve(window.supabase):next();s.onerror=next;document.head.appendChild(s)};next()});return supabaseReady}async function ensureDb(){if(db)return db;const supabase=await loadSupabase();db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return db}
const state={user:null,profile:null,teams:[],team:null,members:[],playlists:[],videos:{},progress:new Set(),memberProgress:new Map(),view:"home",auth:"in",theme:"system",search:"",hideDone:false};
const root=document.getElementById("root"), me=document.getElementById("me");
const $=(s,p=document)=>p.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function toast(x){const t=$("#toast");t.textContent=x;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2200)}
function initials(n){return String(n||"?").trim().split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase()||"?"}
function avatar(p,n){return p?.avatar_url?'<img class="avatar" src="'+esc(p.avatar_url)+'" alt="">':'<div class="avatar">'+esc(initials(n))+"</div>"}
function theme(t){state.theme=t||"system";document.documentElement.dataset.theme=state.theme==="system"?"":state.theme}
async function q(fn,args={}){const {data,error}=await db.rpc(fn,args);if(error)throw error;return data}
async function loadProfile(){if(!state.user)return;const {data,error}=await db.from("profiles").select("*").eq("id",state.user.id).single();if(error)throw error;state.profile=data;theme(data.theme)}
async function loadTeams(){const {data:ms,error}=await db.from("team_members").select("team_id,role,joined_at,teams(id,name,code,created_by,created_at)").eq("user_id",state.user.id);if(error)throw error;state.teams=(ms||[]).map(x=>({...x.teams,role:x.role}));if(!state.team||!state.teams.some(t=>t.id===state.team.id))state.team=state.teams[0]||null}
async function loadTeam(){if(!state.team){state.playlists=[];state.members=[];return}
const {data:m,error:me}=await db.from("team_members").select("user_id,role,joined_at,profiles(id,display_name,avatar_url,bio,learning_goal,theme)").eq("team_id",state.team.id);if(me)throw me;state.members=m||[];
const {data:p,error:pe}=await db.from("playlists").select("*").eq("team_id",state.team.id).order("created_at",{ascending:true});if(pe)throw pe;state.playlists=p||[];
const ids=state.playlists.map(x=>x.id);state.videos={};if(ids.length){const {data:v,error:ve}=await db.from("playlist_videos").select("*").in("playlist_id",ids).order("position");if(ve)throw ve;(v||[]).forEach(x=>(state.videos[x.playlist_id]??=[]).push(x))}
const videoIds=Object.values(state.videos).flat().map(x=>x.id);const {data:pr,error:pre}=videoIds.length?await db.from("video_progress").select("user_id,playlist_video_id").in("playlist_video_id",videoIds):{data:[],error:null};if(pre)throw pre;state.progress=new Set();state.memberProgress=new Map();(pr||[]).forEach(x=>{if(x.user_id===state.user.id)state.progress.add(x.playlist_video_id);if(!state.memberProgress.has(x.user_id))state.memberProgress.set(x.user_id,new Set());state.memberProgress.get(x.user_id).add(x.playlist_video_id)})}
async function load(){if(!state.user)return;await loadProfile();await loadTeams();await loadTeam();render()}
function admin(){return ["owner","admin"].includes(state.team?.role)}
function owner(){return state.team?.role==="owner"}
function counts(){let total=0,done=0;state.playlists.forEach(p=>(state.videos[p.id]||[]).forEach(v=>{total++;if(state.progress.has(v.id))done++}));return{total,done}}
function level(){const n=counts().done;return n>=100?"Master":n>=50?"Advanced":n>=20?"Intermediate":n>=5?"Learner":"Starter"}
function mebar(){if(!state.user){me.innerHTML="";return}me.innerHTML=avatar(state.profile,state.profile?.display_name||state.user.email)+"<span class=name>"+esc(state.profile?.display_name||state.user.email)+"</span><button class="btn ghost small" id=account>Profile</button><button class="btn ghost small" id=signout>Sign out</button>";$("#account").onclick=()=>{state.view="profile";render()};$("#signout").onclick=async()=>{await db.auth.signOut();}}
function shell(content){const c=counts();root.innerHTML='<div class="stats"><div class="stat wide"><div class=muted>Overall progress</div><strong>'+Math.round((c.done/(c.total||1))*100)+'%</strong><div class=progress><i style="width:'+Math.round((c.done/(c.total||1))*100)+'%"></i></div><div class=hint>'+c.done+' of '+c.total+' videos completed · Level: '+level()+'</div></div><div class=stat><div class=muted>Playlists</div><strong>'+state.playlists.length+'</strong></div><div class=stat><div class=muted>Members</div><strong>'+state.members.length+'</strong></div><div class=stat><div class=muted>Team</div><strong>'+esc(state.team?.name||"—")+'</strong></div></div><nav class=tabs><button data-v=home>Trackers</button><button data-v=leaderboard>Leaderboard</button><button data-v=team>Team</button><button data-v=add>Add playlist</button></nav>'+content;document.querySelectorAll(".tabs button").forEach(b=>{b.classList.toggle("active",b.dataset.v===state.view);b.onclick=()=>{state.view=b.dataset.v;render()}})}
function renderAuth(){me.innerHTML="";root.innerHTML='<div class="card auth"><div class=logo2><div class=logo>LT</div></div><h2>Welcome to Learning Tracker</h2><p class=muted>Private team learning, shared playlists and a progress leaderboard.</p><div class=switch><button id=ain>Sign in</button><button id=aup>Create account</button></div><div id=authbox></div></div>';const show=()=>{$("#authbox").innerHTML=state.auth==="in"?'<div class=field><label>Email</label><input id=email type=email autocomplete=email placeholder="you@example.com"></div><div class=field><label>Passcode</label><input id=pass type=password autocomplete=current-password minlength=6></div><button class="btn" id=go>Sign in</button><div class=hint style="margin-top:10px">Your passcode is your Supabase account password.</div>':'<div class=field><label>Display name</label><input id=name maxlength=60 placeholder="Your name"></div><div class=field><label>Email</label><input id=email type=email autocomplete=email placeholder="you@example.com"></div><div class=field><label>Passcode</label><input id=pass type=password autocomplete=new-password minlength=6 placeholder="At least 6 characters"></div><button class="btn" id=go>Create account</button><div class=hint style="margin-top:10px">If email confirmation is enabled, verify your email before signing in.</div>';$("#go").onclick=async()=>{const email=$("#email").value.trim(),pass=$("#pass").value,name=$("#name")?.value.trim();if(!email||pass.length<6||(state.auth==="up"&&name.length<2))return toast("Please fill the fields correctly.");try{await ensureDb();if(state.auth==="up"){const {data,error}=await db.auth.signUp({email,password:pass,options:{data:{display_name:name}}});if(error)throw error;if(!data.session){toast("Account created — check your email to verify it.")}else toast("Account created")}else{const {error}=await db.auth.signInWithPassword({email,password:pass});if(error)throw error}}catch(e){toast(e.message||"Authentication failed")}};$("#ain").onclick=()=>{state.auth="in";show()};$("#aup").onclick=()=>{state.auth="up";show()};$("#ain").classList.toggle("active",state.auth==="in");$("#aup").classList.toggle("active",state.auth==="up");show()}
function home(){let h='<div class="card"><div class=itemhead><div class=grow><div class=eyebrow>Current team</div><h2>'+esc(state.team?.name||"No team")+'</h2><div class=meta>Invite code: <b>'+esc(state.team?.code||"—")+'</b></div></div><div class=actions><button class="btn ghost small" id=copycode>Copy code</button><button class="btn ghost small" id=join>Join another team</button></div></div></div><div class="list" style="margin-top:12px">';if(!state.playlists.length)h+='<div class="card empty">No playlists yet. An admin can add the first playlist.</div>';state.playlists.forEach(p=>{const vs=state.videos[p.id]||[],d=vs.filter(v=>state.progress.has(v.id)).length,pc=Math.round(d/(vs.length||1)*100);h+='<div class="item click" data-p="'+p.id+'"><div class=itemhead><div class=grow><h3>'+esc(p.title)+'</h3><div class=meta>'+esc(p.channel||"")+" · "+vs.length+" videos</div></div><span class=pill>'+pc+'%</span></div><div class=progress style="margin-top:10px"><i style="width:'+pc+'%"></i></div></div>'});h+='</div>';shell(h);$("#copycode").onclick=()=>navigator.clipboard?.writeText(state.team.code).then(()=>toast("Team code copied"));$("#join").onclick=joinDialog;document.querySelectorAll("[data-p]").forEach(x=>x.onclick=()=>{state.view="playlist";state.pid=x.dataset.p;render()})}
function playlist(){const p=state.playlists.find(x=>x.id===state.pid);if(!p){state.view="home";return home()}let vs=state.videos[p.id]||[];const q=state.search.toLowerCase();vs=vs.filter(v=>(v.title||"").toLowerCase().includes(q)&&(!state.hideDone||!state.progress.has(v.id)));let d=(state.videos[p.id]||[]).filter(v=>state.progress.has(v.id)).length;let h='<div class="card"><div class=itemhead><div class=grow><button class="btn ghost small" id=back>← Back</button><h2 style="margin-top:10px">'+esc(p.title)+'</h2><div class=meta>'+esc(p.channel||"")+" · "+d+"/"+(state.videos[p.id]||[]).length+" complete</div></div>"+(p.url?'<a class="btn ghost small" href="'+esc(p.url)+'" target="_blank" rel="noreferrer">Open playlist</a>':"")+'</div><div class=actions style="margin-top:12px"><input id=search placeholder="Search videos" value="'+esc(state.search)+'"><button class="btn ghost small" id=hide>'+ (state.hideDone?"Show watched":"Hide watched")+'</button></div><div style="margin-top:8px">';vs.forEach((v,i)=>{h+='<div class="video '+(state.progress.has(v.id)?"done":"")+'"><input type=checkbox data-v="'+v.id+'" '+(state.progress.has(v.id)?"checked":"")+'><span class=vtitle>'+esc(v.position+1)+'. '+esc(v.title)+'</span>'+(v.video_url?'<a href="'+esc(v.video_url)+'" target="_blank" rel="noreferrer">YouTube</a>':"")+'</div>'});h+='</div></div>';if(admin())h+='<div class="card"><div class=actions><button class="btn danger" id=delete>Delete playlist</button></div><div class=hint style="margin-top:7px">Only team admins can delete playlists. This also removes its videos and progress.</div></div>';shell(h);$("#back").onclick=()=>{state.view="home";render()};$("#search").oninput=e=>{state.search=e.target.value;playlist()};$("#hide").onclick=()=>{state.hideDone=!state.hideDone;playlist()};document.querySelectorAll("[data-v]").forEach(c=>c.onchange=()=>toggleProgress(c.dataset.v,c.checked));$("#delete")?.addEventListener("click",()=>deletePlaylist(p))}
async function toggleProgress(id,on){try{if(on){const {error}=await db.from("video_progress").upsert({user_id:state.user.id,playlist_video_id:id,updated_at:new Date().toISOString()},{onConflict:"user_id,playlist_video_id"});if(error)throw error;state.progress.add(id)}else{const {error}=await db.from("video_progress").delete().eq("user_id",state.user.id).eq("playlist_video_id",id);if(error)throw error;state.progress.delete(id)}render()}catch(e){toast(e.message)}}
async function deletePlaylist(p){if(!confirm("Delete this playlist and its videos?"))return;try{const {error}=await db.from("playlists").delete().eq("id",p.id);if(error)throw error;toast("Playlist deleted");await load()}catch(e){toast(e.message)}}
function add(){if(!admin())return shell('<div class="card notice">Only team admins can add playlists.</div>');shell('<div class="card"><h2>Add playlist</h2><p class=muted>Add a playlist and paste one video per line. The database keeps it private to this team.</p><div class=field><label>Title</label><input id=ptitle placeholder="Spring Boot Course"></div><div class=field><label>Channel (optional)</label><input id=channel placeholder="Java Brains"></div><div class=field><label>Playlist URL (optional)</label><input id=purl type=url placeholder="https://www.youtube.com/playlist?list=..."></div><div class=field><label>Videos</label><textarea id=videos placeholder="Introduction\nSpring Boot Basics\nREST APIs"></textarea></div><button class=btn id=savep>Create playlist</button></div>');$("#savep").onclick=async()=>{const title=$("#ptitle").value.trim(),channel=$("#channel").value.trim(),url=$("#purl").value.trim(),lines=$("#videos").value.split("\n").map(x=>x.trim()).filter(Boolean);if(!title||!lines.length)return toast("Title and at least one video are required.");try{const {data:p,error}=await db.from("playlists").insert({team_id:state.team.id,title,channel,url,created_by:state.user.id}).select().single();if(error)throw error;const rows=lines.map((t,i)=>({playlist_id:p.id,position:i,title:t}));const {error:ve}=await db.from("playlist_videos").insert(rows);if(ve)throw ve;toast("Playlist created");await load();state.view="home";render()}catch(e){toast(e.message)}}
function leaderboard(){const rows=[];state.members.forEach(m=>rows.push({m,done:0,total:0}));state.playlists.forEach(p=>(state.videos[p.id]||[]).forEach(v=>{rows.forEach(r=>{if(state.memberProgress.get(r.m.user_id)?.has(v.id))r.done++;r.total++})}));rows.sort((a,b)=>b.done-a.done);let h='<div class="card"><div class=itemhead><div class=grow><h2>Leaderboard</h2><div class=muted>Completed videos in this team</div></div></div><div class=overflow-x><table><thead><tr><th>#</th><th>Learner</th><th>Progress</th><th>Done</th></tr></thead><tbody>';rows.forEach((r,i)=>{const pc=Math.round(r.done/(r.total||1)*100);h+='<tr class="'+(r.m.user_id===state.user.id?"me-row":"")+'"><td>'+(i+1)+'</td><td><div class=who>'+avatar(r.m.profiles,r.m.profiles?.display_name)+'<span>'+esc(r.m.profiles?.display_name||"Member")+'</span></div></td><td><div class=progress><i style="width:'+pc+'%"></i></div></td><td>'+r.done+'</td></tr>'});h+='</tbody></table></div></div>';shell(h)}
function team(){let h='<div class="grid two"><div class="card"><h2>'+esc(state.team?.name||"Team")+'</h2><div class=field style="margin-top:12px"><label>Team code</label><input readonly value="'+esc(state.team?.code||"")+'"></div><div class=actions><button class=btn id=copy>Copy invite code</button><button class="btn ghost" id=newteam>Create team</button></div></div><div class="card"><h2>Members</h2><div class=list style="margin-top:10px">';state.members.forEach(m=>{const can=owner()&&m.user_id!==state.user.id;h+='<div class=item><div class=itemhead>'+avatar(m.profiles,m.profiles?.display_name)+'<div class=grow"><b>'+esc(m.profiles?.display_name||"Member")+'</b><div class=meta>'+esc(m.profiles?.learning_goal||"No goal set")+'</div></div><span class=pill>'+m.role+'</span></div>'+(can?'<div class=actions style="margin-top:8px"><select data-role="'+m.user_id+'"><option value=member '+(m.role==="member"?"selected":"")+'>Member</option><option value=admin '+(m.role==="admin"?"selected":"")+'>Admin</option></select></div>':"")+'</div>'});h+='</div></div></div>';shell(h);$("#copy").onclick=()=>navigator.clipboard?.writeText(state.team.code).then(()=>toast("Invite code copied"));$("#newteam").onclick=createTeam;document.querySelectorAll("[data-role]").forEach(s=>s.onchange=async()=>{try{await q("set_team_member_role",{p_team_id:state.team.id,p_user_id:s.dataset.role,p_role:s.value});await load()}catch(e){toast(e.message)}})}
function profile(){shell('<div class="card"><h2>Your profile</h2><p class=muted>Edit the details teammates see.</p><div class=grid two><div><div class=field><label>Display name</label><input id=dn value="'+esc(state.profile?.display_name||"")+'"></div><div class=field><label>Learning goal</label><input id=goal value="'+esc(state.profile?.learning_goal||"")+'" placeholder="Finish Spring Boot course"></div><div class=field><label>About</label><textarea id=bio>'+esc(state.profile?.bio||"")+'</textarea></div></div><div><div class=field><label>Profile picture URL</label><input id=avatarurl type=url value="'+esc(state.profile?.avatar_url||"")+'" placeholder="https://..."></div><div class=field><label>Theme</label><select id=th><option value=system>System</option><option value=light>Light</option><option value=dark>Dark</option></select></div><div class=notice><b>Learning level: '+level()+'</b><div class=hint>Based on videos you have completed in the current team.</div></div></div></div><button class=btn id=saveprofile>Save profile</button></div>');$("#th").value=state.profile?.theme||"system";$("#saveprofile").onclick=async()=>{try{const patch={display_name:$("#dn").value.trim(),learning_goal:$("#goal").value.trim(),bio:$("#bio").value.trim(),avatar_url:$("#avatarurl").value.trim()||null,theme:$("#th").value,updated_at:new Date().toISOString()};const {error}=await db.from("profiles").update(patch).eq("id",state.user.id);if(error)throw error;await load();toast("Profile saved")}catch(e){toast(e.message)}}}
function joinDialog(){modal('<h2>Join a team</h2><p class=muted>Enter the unique team code shared by a friend.</p><div class=field><label>Team code</label><input id=jcode maxlength=10 style="text-transform:uppercase"></div><button class=btn id=jbtn>Join team</button>');$("#jbtn").onclick=async()=>{try{await q("join_team_by_code",{p_code:$("#jcode").value.trim().toUpperCase()});closeModal();await load();toast("Joined team")}catch(e){toast(e.message)}}}
function createTeam(){modal('<h2>Create a team</h2><div class=field><label>Team name</label><input id=tname placeholder="My Study Group"></div><button class=btn id=tbtn>Create team</button>');$("#tbtn").onclick=async()=>{try{const t=await q("create_team",{p_name:$("#tname").value.trim()});closeModal();await load();state.team=state.teams.find(x=>x.id===t.id)||state.team;toast("Team created");render()}catch(e){toast(e.message)}}}
function modal(body){let m=document.createElement("div");m.className="modal";m.innerHTML="<div class=card>"+body+'<button class="btn ghost" id=mc style="margin-top:10px">Cancel</button></div>';document.body.appendChild(m);$("#mc",m).onclick=closeModal;m.onclick=e=>{if(e.target===m)closeModal()}}
function closeModal(){$(".modal")?.remove()}
function render(){mebar();if(!state.user)return renderAuth();if(state.view==="playlist")return playlist();if(state.view==="leaderboard")return leaderboard();if(state.view==="team")return team();if(state.view==="add")return add();if(state.view==="profile")return profile();home()}
async function boot(){renderAuth();try{await ensureDb();db.auth.onAuthStateChange(async(_e,session)=>{state.user=session?.user||null;if(state.user){try{await load()}catch(e){toast(e.message)}}else{state.profile=null;state.teams=[];state.team=null;render()}});const {data}=await db.auth.getSession();state.user=data.session?.user||null;if(state.user){try{await load()}catch(e){toast(e.message)}}}catch(e){toast("Database connection is unavailable.");console.error(e)}}boot();
</script>
</body>
</html>
