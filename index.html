<div class="wrap">
<header class="app-head"><div class="app-brand"><img src="assets/learningbeyond-logo.svg" alt="LearningBeyond" class="brand-logo"><div><h1>LearningBeyond</h1><div class="sub">Learn today · create tomorrow</div></div></div><div id="me" class="app-user"></div></header>

<script>
"use strict";
const SUPABASE_URL="https://ejlgobrbajobdbcjodhr.supabase.co";
const SUPABASE_KEY="sb_publishable_Y1qSvfxdjUUpIzH6USAl2g_di7FwICk";
let db=null;let supabaseReady=null;function loadSupabase(){if(window.supabase)return Promise.resolve(window.supabase);if(supabaseReady)return supabaseReady;supabaseReady=new Promise((resolve,reject)=>{const urls=["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2","https://unpkg.com/@supabase/supabase-js@2"];let i=0;const next=()=>{if(window.supabase)return resolve(window.supabase);if(i>=urls.length)return reject(new Error("Could not load the Supabase client library."));const s=document.createElement("script");s.src=urls[i++];s.onload=()=>window.supabase?resolve(window.supabase):next();s.onerror=next;document.head.appendChild(s)};next()});return supabaseReady}async function ensureDb(){if(db)return db;const supabase=await loadSupabase();db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return db}
const state={user:null,profile:null,teams:[],team:null,members:[],playlists:[],videos:{},progress:new Set(),memberProgress:new Map(),view:"home",auth:"in",theme:"system",search:"",hideDone:false};
const root=document.getElementById("root"), me=document.getElementById("me");
const $=(s,p=document)=>p.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function toast(x){const t=$("#toast");t.textContent=x;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2200)}
function initials(n){return String(n||"?").trim().split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase()||"?"}
function avatar(p,n){return p?.avatar_url?'<img class="avatar" src="'+esc(p.avatar_url)+'" alt="">':'<div class="avatar">'+esc(initials(n))+"</div>"}
function theme(t){state.theme=t||"system";document.documentElement.dataset.theme=state.theme==="system"?"":state.theme}

ated_at).toLocaleDateString())+'</strong></div></div><div class="actions" style="margin-top:14px"><button class="btn ghost small" id="copyTeamCode">Copy invite code</button><button class="btn ghost small" id="shareTeamDetails">Share team link</button><button class="btn danger small" id="leaveTeamDetails">Leave team</button></div><div style="margin-top:20px"><div class="itemhead"><div class="grow"><h3>Members</h3><div class="meta">Manage roles from the team owner account.</div></div></div><div class="team-members-list">';state.members.forEach(m=>{const can=owner()&&m.user_id!==state.user.id;h+='<div class="team-member">'+avatar(m.profiles,m.profiles?.display_name)+'<div class="grow"><b>'+esc(m.profiles?.display_name||"Member")+'</b><div class="meta">'+esc(m.profiles?.learning_goal||"No goal set")+'</div></div><span class="pill">'+esc(m.role)+'</span>'+(can?'<select class="role-select" data-role="'+esc(m.user_id)+'"><option value=member '+(m.role==="member"?"selected":"")+'>Member</option><option value=admin '+(m.role==="admin"?"selected":"")+'>Admin</option></select>':"")+'</div>'});h+='</div></div></div>'}shell(h);document.querySelectorAll("[data-switch-team]").forEach(b=>b.onclick=async()=>{const id=b.dataset.switchTeam;try{b.disabled=true;await switchTeam(id)}catch(e){toast(e.message);b.disabled=false}});document.querySelectorAll("[data-copy-team]").forEach(b=>b.onclick=()=>navigator.clipboard?.writeText(b.dataset.copyTeam).then(()=>toast("Invite code copied")));$( "#joinTeam").onclick=joinDialog;$( "#createTeam").onclick=createTeam;$( "#copyTeamCode")?.addEventListener("click",()=>navigator.clipboard?.writeText(state.team.code).then(()=>toast("Invite code copied")));$( "#shareTeamDetails")?.addEventListener("click",shareTeamLink);$( "#leaveTeamDetails")?.addEventListener("click",leaveCurrentTeam);document.querySelectorAll("[data-role]").forEach(sel=>sel.onchange=async()=>{try{await q("set_team_member_role",{p_team_id:state.team.id,p_user_id:sel.dataset.role,p_role:sel.value});await load()}catch(e){toast(e.message)}})}
function profile(){shell('<div class="card"><h2>Your profile</h2><p class=muted>Edit the details teammates see.</p><div class=grid two><div><div class=field><label>Display name</label><input id=dn value="'+esc(state.profile?.display_name||"")+'"></div><div class=field><label>Learning goal</label><input id=goal value="'+esc(state.profile?.learning_goal||"")+'" placeholder="Finish Spring Boot course"></div><div class=field><label>About</label><textarea id=bio>'+esc(state.profile?.bio||"")+'</textarea></div></div><div><div class=field><label>Profile picture URL</label><input id=avatarurl type=url value="'+esc(state.profile?.avatar_url||"")+'" placeholder="https://..."></div><div class=field><label>Theme</label><select id=th><option value=system>System</option><option value=light>Light</option><option value=dark>Dark</option></select></div><div class=notice><b>Learning level: '+level()+'</b><div class=hint>Based on videos you have completed in the current team.</div></div></div></div><button class=btn id=saveprofile>Save profile</button></div>');$("#th").value=state.profile?.theme||"system";$("#saveprofile").onclick=async()=>{try{const patch={display_name:$("#dn").value.trim(),learning_goal:$("#goal").value.trim(),bio:$("#bio").value.trim(),avatar_url:$("#avatarurl").value.trim()||null,theme:$("#th").value,updated_at:new Date().toISOString()};const {error}=await db.from("profiles").update(patch).eq("id",state.user.id);if(error)throw error;await load();toast("Profile saved")}catch(e){toast(e.message)}}}
function joinDialog(){modal('<h2>Join a team</h2><p class=muted>Enter the unique team code shared by a friend.</p><div class=field><label>Team code</label><input id=jcode maxlength=10 style="text-transform:uppercase"></div><button class=btn id=jbtn>Join team</button>');$("#jbtn").onclick=async()=>{try{const joined=await q("join_team_by_code",{p_code:$("#jcode").value.trim().toUpperCase()});closeModal();await loadTeams();state.team=state.teams.find(t=>t.id===joined.team_id)||state.team;await loadTeam();state.view="home";render();toast("Joined team")}catch(e){toast(e.message)}}}
function createTeam(){modal('<h2>Create a team</h2><div class=field><label>Team name</label><input id=tname placeholder="My Study Group"></div><button class=btn id=tbtn>Create team</button>');$("#tbtn").onclick=async()=>{try{const t=await q("create_team",{p_name:$("#tname").value.trim()});closeModal();await loadTeams();state.team=state.teams.find(x=>x.id===t.team_id)||state.team;await loadTeam();state.view="home";render();toast("Team created")}catch(e){toast(e.message)}}}
function modal(body){let m=document.createElement("div");m.className="modal";m.innerHTML="<div class=card>"+body+'<button class="btn ghost" id=mc style="margin-top:10px">Cancel</button></div>';document.body.appendChild(m);$("#mc",m).onclick=closeModal;m.onclick=e=>{if(e.target===m)closeModal()}}
function closeModal(){$(".modal")?.remove()}
function bindTeamControls(){document.querySelectorAll("#teamSelect").forEach(x=>x.onchange=e=>switchTeam(e.target.value));document.querySelectorAll("#leaveTeam").forEach(x=>x.onclick=leaveCurrentTeam)}
function render(){if(!state.user){document.body.classList.add("auth-page");mebar();return renderAuth()}document.body.classList.remove("auth-page");mebar();if(state.view==="playlist")return playlist();if(state.view==="leaderboard")return leaderboard();if(state.view==="team")return team();if(state.view==="add")return add();if(state.view==="profile")return profile();home()}
async function boot(){renderAuth();try{await ensureDb();db.auth.onAuthStateChange(async(_e,session)=>{state.user=session?.user||null;if(state.user){try{await load()}catch(e){toast(e.message)}}else{state.profile=null;state.teams=[];state.team=null;render()}});const {data}=await db.auth.getSession();state.user=data.session?.user||null;if(state.user){try{await load()}catch(e){toast(e.message)}}}catch(e){toast("Database connection is unavailable.");console.error(e)}}boot();
</script>
