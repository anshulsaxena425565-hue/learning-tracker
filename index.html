let db=null;let supabaseReady=null;function loadSupabase(){if(window.supabase)return Promise.resolve(window.supabase);if(supabaseReady)return supabaseReady;supabaseReady=new Promise((resolve,reject)=>{const urls=["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2","https://unpkg.com/@supabase/supabase-js@2"];let i=0;const next=()=>{if(window.supabase)return resolve(window.supabase);if(i>=urls.length)return reject(new Error("Could not load the Supabase client library."));const s=document.createElement("script");s.src=urls[i++];s.onload=()=>window.supabase?resolve(window.supabase):next();s.onerror=next;document.head.appendChild(s)};next()});return supabaseReady}async function ensureDb(){if(db)return db;const supabase=await loadSupabase();db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return db}
const state={user:null,profile:null,teams:[],team:null,members:[],playlists:[],videos:{},progress:new Set(),memberProgress:new Map(),chapters:new Map(),view:"home",auth:"in",theme:"system",search:"",hideDone:false,playerVideoId:null,player:null,playerReady:false,courseTab:"outline",watchAccum:{},lastTick:null,transcripts:new Map(),realtime:null};

const {data:m,error:me}=await db.from("team_members").select("user_id,role,joined_at,profiles(id,display_name,avatar_url,bio,learning_goal,theme)").eq("team_id",state.team.id);if(me)throw me;state.members=m||[];

async function load(){if(!state.user)return;await loadProfile();await loadTeams();await loadTeam();document.body.classList.remove("auth-page");render();const invite=new URLSearchParams(location.search).get("join");if(invite&&!sessionStorage.getItem("lb_invite_seen_"+invite)){sessionStorage.setItem("lb_invite_seen_"+invite,"1");modal('<h2>Team invitation</h2><p class=muted>You were invited to join a LearningBeyond team.</p><div class=field><label>Team code</label><input readonly value="'+esc(invite.toUpperCase())+'"></div><button class=btn id=acceptInvite>Join team</button>');$( "#acceptInvite").onclick=async()=>{try{await q("join_team_by_code",{p_code:invite.toUpperCase()});closeModal();await loadTeams();state.team=state.teams.find(t=>t.code===invite.toUpperCase())||state.team;await loadTeam();state.view="team";history.replaceState({},document.title,location.pathname);render();toast("Joined team")}catch(e){toast(e.message)}}}}function admin(){return ["owner","admin"].includes(state.team?.role)}

function stopWatchTimer(){clearInterval(watchTimer);watchTimer=null;state.lastTick=null}
let watchTimer=null;
function startWatchTimer(){stopWatchTimer();state.lastTick=state.player?.getCurrentTime?.()||0;watchTimer=setInterval(async()=>{if(!state.player||typeof state.player.getCurrentTime!=="function")return;const now=state.player.getCurrentTime(),dur=state.player.getDuration();const prev=state.lastTick;state.lastTick=now;if(!dur||prev===null)return;const delta=now-prev;if(delta>=0&&delta<=3.5){state.watchAccum[state.playerVideoId]=(state.watchAccum[state.playerVideoId]||0)+delta;const watched=state.watchAccum[state.playerVideoId];if(watched%10<3.5)await saveWatchProgress(state.playerVideoId,watched,dur,now,false);if(watched>=dur*0.9&&!state.progress.has(state.playerVideoId)){await finishWatch(state.playerVideoId)}}},2000)}
async function finishWatch(videoId){if(!videoId||state.progress.has(videoId))return;const dur=state.player?.getDuration?.()||0,watched=state.watchAccum[videoId]||0;if(!dur||watched<dur*0.9)return;await saveWatchProgress(videoId,watched,dur,state.player?.getCurrentTime?.()||0,true);state.progress.add(videoId);const row=state._progress.get(videoId)||{};state._progress.set(videoId,{...row,completed_at:new Date().toISOString(),watched_seconds:Math.floor(watched),duration_seconds:Math.floor(dur),last_position_seconds:Math.floor(state.player?.getCurrentTime?.()||0)});stopWatchTimer();renderCourseSidebar();updateCourseHeader();toast("Video automatically marked complete after 90% real playback.")}
function updateCourseHeader(){const p=state.playlists.find(x=>x.id===state.pid);if(!p)return;const done=progressCount(p.id),total=(state.videos[p.id]||[]).length;const ey=$(".player-info .eyebrow");if(ey)ey.textContent="COURSE · "+done+"/"+total+" COMPLETE";const meta=$(".course-side-head .meta");if(meta)meta.textContent=done+" of "+total+" videos complete";const bar=$(".course-side-head .progress i");if(bar)bar.style.width=Math.round(done/(total||1)*100)+"%"}
function renderCourseSidebar(){const p=state.playlists.find(x=>x.id===state.pid);if(!p)return;const list=$(".course-list");if(!list)return;(state.videos[p.id]||[]).forEach(v=>{const el=list.querySelector('[data-course-video="'+v.id+'"]');if(!el)return;el.classList.toggle("done",state.progress.has(v.id));const cb=el.querySelector("[data-player-check]");if(cb)cb.checked=state.progress.has(v.id);const meta=el.querySelector(".course-item-meta");if(meta)meta.textContent=(state.progress.has(v.id)?"✓ Completed · ":"Not completed · ")+(state.chapters.get(v.id)?.length||0)+" chapters"})}

function leaderboard(){const rows=state.members.map(m=>({m,done:0,total:0}));for(const p of state.playlists){for(const v of (state.videos[p.id]||[])){for(const r of rows){r.total++;if(state.memberProgress.get(r.m.user_id)?.has(v.id))r.done++}}}rows.sort((a,b)=>b.done-a.done);let h='<div class="card"><div class="itemhead"><div class=grow><div class=eyebrow>TEAM PROGRESS</div><h2>Leaderboard</h2><div class=muted>Completed videos across this team</div></div></div><div class=overflow-x><table><thead><tr><th>#</th><th>Learner</th><th>Progress</th><th>Done</th></tr></thead><tbody>';rows.forEach((r,i)=>{const pc=Math.round(r.done/(r.total||1)*100);h+='<tr class="'+(r.m.user_id===state.user.id?"me-row":"")+'"><td>'+(i+1)+'</td><td><div class=who>'+avatar(r.m.profiles,r.m.profiles?.display_name)+'<span>'+esc(r.m.profiles?.display_name||"Member")+'</span></div></td><td><div class=progress><i style="width:'+pc+'%"></i></div><div class=meta style="margin-top:4px">'+pc+'%</div></td><td>'+r.done+'</td></tr>'});h+='</tbody></table></div></div>';shell(h)}
function add(){if(!admin()){shell('<div class="card notice"><b>Admin access required.</b><div class="hint">Only team owners and admins can add playlists.</div></div>');return}shell('<div class="card"><div class=eyebrow>AUTOMATIC IMPORT</div><h2>Import a YouTube playlist</h2><p class=muted>Paste a playlist URL. Videos, exact video IDs and available YouTube chapters are fetched automatically.</p><div class=field><label>YouTube playlist URL</label><input id=yturl placeholder="https://www.youtube.com/playlist?list=..."></div><button class=btn id=importyt>Import playlist automatically</button><div id=importstatus class=hint style="margin-top:10px"></div></div><div class="card" style="margin-top:12px"><div class=eyebrow>MANUAL</div><h2>Add manually</h2><p class=muted>Use this when the content is not a YouTube playlist.</p><div class=field><label>Title</label><input id=ptitle placeholder="Course title"></div><div class=field><label>Channel</label><input id=channel placeholder="Channel name"></div><div class=field><label>Playlist URL</label><input id=purl placeholder="https://www.youtube.com/playlist"></div><div class=field><label>Videos</label><textarea id=videos placeholder="One video title per line"></textarea></div><button class=btn id=savep>Create course</button></div>');
$("#importyt").onclick=async()=>{const url=$("#yturl").value.trim(),s=$("#importstatus"),b=$("#importyt");if(!url){s.textContent="Paste a playlist URL first.";return}b.disabled=true;b.textContent="Importing…";s.textContent="Fetching videos and chapters…";try{const r=await db.functions.invoke("import-youtube-playlist",{body:{team_id:state.team.id,playlist_url:url}});if(r.error)throw r.error;const d=r.data||{};if(d.error)throw new Error(d.error);await loadTeam();state.view="home";render();toast((d.videos_imported||0)+" videos imported · "+(d.chapters_imported||0)+" chapters found")}catch(e){s.textContent=e.message||"Import failed.";toast(s.textContent)}finally{b.disabled=false;b.textContent="Import playlist automatically"}};
$("#savep").onclick=async()=>{try{const title=$("#ptitle").value.trim(),channel=$("#channel").value.trim(),url=$("#purl").value.trim(),items=$("#videos").value.split(String.fromCharCode(10)).map(x=>x.trim()).filter(Boolean);if(!title||!items.length){toast("Title and at least one video are required.");return}const r=await db.from("playlists").insert({team_id:state.team.id,title,channel,url,created_by:state.user.id}).select().single();if(r.error)throw r.error;const v=await db.from("playlist_videos").insert(items.map((t,i)=>({playlist_id:r.data.id,position:i,title:t})));if(v.error)throw v.error;toast("Course created");await loadTeam();state.view="home";render()}catch(e){toast(e.message)}}}
function team(){const active=state.team?.id;let h='<div class="card"><div class="team-section-head"><div class="grow"><div class="eyebrow">Workspace</div><h2>Your teams</h2><div class="muted">Switch teams, manage members and keep each team completely separate.</div></div><div class="actions"><button class="btn ghost" id="joinTeam">Join team</button><button class="btn" id="createTeam">Create team</button></div></div><div class="team-grid">';state.teams.forEach(t=>{const is=t.id===active;h+='<div class="team-card '+(is?'active':'')+'"><div class="team-card-top"><div class="team-icon">'+esc(initials(t.name).slice(0,2))+'</div><div class="grow"><h3>'+esc(t.name)+'</h3><div class="meta">'+(is?'Currently selected':'Available team')+'</div></div><span class="pill team-role">'+esc(t.role)+'</span></div><div class="team-code"><span class="meta">Invite code</span><b>'+esc(t.code)+'</b></div><div class="team-card-actions">'+(is?'<button class="btn ghost small" disabled>Current team</button>':'<button class="btn small" data-switch-team="'+esc(t.id)+'">Switch to team</button>')+'<button class="btn ghost small" data-copy-team="'+esc(t.code)+'">Copy code</button></div></div>'});h+='</div></div>';if(state.team){h+='<div class="card team-details"><div class="itemhead"><div class="grow"><div class="eyebrow">Team details</div><h2>'+esc(state.team.name)+'</h2><div class="meta">Your role: <b>'+esc(state.team.role)+'</b></div></div>'+(owner()&&state.members.length===1?'<span class="pill">Owner</span>':"")+'</div><div class="team-detail-grid" style="margin-top:14px"><div class="team-detail-box"><div class="label">Invite code</div><strong>'+esc(state.team.code)+'</strong></div><div class="team-detail-box"><div class="label">Members</div><strong>'+state.members.length+'</strong></div><div class="team-detail-box"><div class="label">Playlists</div><strong>'+state.playlists.length+'</strong></div><div class="team-detail-box"><div class="label">Created</div><strong>'+esc(new Date(state.team.created_at).toLocaleDateString())+'</strong></div></div><div class="actions" style="margin-top:14px"><button class="btn ghost small" id="copyTeamCode">Copy invite code</button><button class="btn ghost small" id="shareTeamDetails">Share team link</button><button class="btn danger small" id="leaveTeamDetails">Leave team</button></div><div style="margin-top:20px"><div class="itemhead"><div class="grow"><h3>Members</h3><div class="meta">Manage roles from the team owner account.</div></div></div><div class="team-members-list">';state.members.forEach(m=>{const can=owner()&&m.user_id!==state.user.id;h+='<div class="team-member">'+avatar(m.profiles,m.profiles?.display_name)+'<div class="grow"><b>'+esc(m.profiles?.display_name||"Member")+'</b><div class="meta">'+esc(m.profiles?.learning_goal||"No goal set")+'</div></div><span class="pill">'+esc(m.role)+'</span>'+(can?'<select class="role-select" data-role="'+esc(m.user_id)+'"><option value=member '+(m.role==="member"?"selected":"")+'>Member</option><option value=admin '+(m.role==="admin"?"selected":"")+'>Admin</option></select>':"")+'</div>'});h+='</div></div></div>'}shell(h);document.querySelectorAll("[data-switch-team]").forEach(b=>b.onclick=async()=>{const id=b.dataset.switchTeam;try{b.disabled=true;await switchTeam(id)}catch(e){toast(e.message);b.disabled=false}});document.querySelectorAll("[data-copy-team]").forEach(b=>b.onclick=()=>navigator.clipboard?.writeText(b.dataset.copyTeam).then(()=>toast("Invite code copied")));$( "#joinTeam").onclick=joinDialog;$( "#createTeam").onclick=createTeam;$( "#copyTeamCode")?.addEventListener("click",()=>navigator.clipboard?.writeText(state.team.code).then(()=>toast("Invite code copied")));$( "#shareTeamDetails")?.addEventListener("click",shareTeamLink);$( "#leaveTeamDetails")?.addEventListener("click",leaveCurrentTeam);document.querySelectorAll("[data-role]").forEach(sel=>sel.onchange=async()=>{try{await q("set_team_member_role",{p_team_id:state.team.id,p_user_id:sel.dataset.role,p_role:sel.value});await load()}catch(e){toast(e.message)}})}
function profile(){const p=state.profile||{},name=p.display_name||"Learner",initials=name.trim().split(/\\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()||"L";shell('<div class="card profile-shell"><div class="profile-hero"><div id=profileAvatarPreview class=profile-avatar>'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">':initials)+'</div><div class=grow><h2>Your profile</h2><div class=muted>Shape how your learning identity appears to teammates.</div></div><span class="pill profile-role">'+esc(state.team?.role||"Member")+'</span></div><div class=profile-body><section><div class=profile-section-title>Personal details</div><div class=profile-field><label>Display name</label><input id=dn maxlength=60 value="'+esc(p.display_name||"")+'" placeholder="Your name"></div><div class=profile-field><label>Learning goal</label><input id=goal maxlength=120 value="'+esc(p.learning_goal||"")+'" placeholder="e.g. Become a Spring Boot developer"></div><div class=profile-field><label>About</label><textarea id=bio maxlength=500 placeholder="A short intro for your teammates...">'+esc(p.bio||"")+'</textarea></div></section><aside class=profile-side><div class=profile-section-title>Profile appearance</div><div class=profile-preview><div id=profileMini class=profile-avatar>'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">':initials)+'</div><div class=grow><div id=profilePreviewName class=profile-preview-name>'+esc(name)+'</div><div id=profilePreviewGoal class=profile-preview-goal>'+esc(p.learning_goal||"Your learning goal")+'</div></div></div><div class=profile-field><label>Profile picture URL</label><input id=avatarurl type=url value="'+esc(p.avatar_url||"")+'" placeholder="https://..."></div><div class=profile-field><label>Theme</label><div class=theme-options><label class=theme-option><input type=radio name=theme value=system '+(p.theme==="system"||!p.theme?"checked":"")+'><span>System</span></label><label class=theme-option><input type=radio name=theme value=light '+(p.theme==="light"?"checked":"")+'><span>Light</span></label><label class=theme-option><input type=radio name=theme value=dark '+(p.theme==="dark"?"checked":"")+'><span>Dark</span></label></div></div><div class=profile-level><div class=profile-level-label>Current learning level</div><strong>'+esc(level())+'</strong><div class=hint>Based on your completed videos in this team.</div></div></aside></div><div class=profile-actions><button class="btn ghost" id=cancelprofile>Cancel</button><button class=btn id=saveprofile>Save changes</button></div></div>');const updatePreview=()=>{const n=$("#dn").value.trim()||"Learner",g=$("#goal").value.trim()||"Your learning goal";$("#profilePreviewName").textContent=n;$("#profilePreviewGoal").textContent=g};$("#dn").oninput=updatePreview;$("#goal").oninput=updatePreview;$("#avatarurl").oninput=()=>{const u=$("#avatarurl").value.trim(),html=u?'<img src="'+esc(u)+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">':initials;$("#profileAvatarPreview").innerHTML=html;$("#profileMini").innerHTML=html};$("#cancelprofile").onclick=()=>render();$("#saveprofile").onclick=async()=>{try{const theme=document.querySelector('input[name="theme"]:checked')?.value||"system";const patch={display_name:$("#dn").value.trim(),learning_goal:$("#goal").value.trim(),bio:$("#bio").value.trim(),avatar_url:$("#avatarurl").value.trim()||null,theme,updated_at:new Date().toISOString()};const {error}=await db.from("profiles").update(patch).eq("id",state.user.id);if(error)throw error;await load();toast("Profile saved")}catch(e){toast(e.message)}}}
function joinDialog(){modal('<h2>Join a team</h2><p class=muted>Enter the unique team code shared by a friend.</p><div class=field><label>Team code</label><input id=jcode maxlength=10 style="text-transform:uppercase"></div><button class=btn id=jbtn>Join team</button>');$("#jbtn").onclick=async()=>{try{const joined=await q("join_team_by_code",{p_code:$("#jcode").value.trim().toUpperCase()});closeModal();await loadTeams();state.team=state.teams.find(t=>t.id===joined.team_id)||state.team;await loadTeam();state.view="home";render();toast("Joined team")}catch(e){toast(e.message)}}}
function createTeam(){modal('<h2>Create a team</h2><div class=field><label>Team name</label><input id=tname placeholder="My Study Group"></div><button class=btn id=tbtn>Create team</button>');$("#tbtn").onclick=async()=>{try{const t=await q("create_team",{p_name:$("#tname").value.trim()});closeModal();await loadTeams();state.team=state.teams.find(x=>x.id===t.team_id)||state.team;await loadTeam();state.view="home";render();toast("Team created")}catch(e){toast(e.message)}}}
function modal(body){let m=document.createElement("div");m.className="modal";m.innerHTML="<div class=card>"+body+'<button class="btn ghost" id=mc style="margin-top:10px">Cancel</button></div>';document.body.appendChild(m);$("#mc",m).onclick=closeModal;m.onclick=e=>{if(e.target===m)closeModal()}}
function closeModal(){$(".modal")?.remove()}
function bindTeamControls(){document.querySelectorAll("#teamSelect").forEach(x=>x.onchange=e=>switchTeam(e.target.value));document.querySelectorAll("#leaveTeam").forEach(x=>x.onclick=leaveCurrentTeam)}
function render(){if(!state.user){document.body.classList.add("auth-page");mebar();return renderAuth()}document.body.classList.remove("auth-page");mebar();if(state.view==="playlist")return playlist();if(state.view==="leaderboard")return leaderboard();if(state.view==="team")return team();if(state.view==="add")return add();if(state.view==="profile")return profile();home()}
async function boot(){renderAuth();try{await ensureDb();db.auth.onAuthStateChange(async(_e,session)=>{state.user=session?.user||null;if(state.user){try{await load()}catch(e){toast(e.message)}}else{state.profile=null;state.teams=[];state.team=null;render()}});const {data}=await db.auth.getSession();state.user=data.session?.user||null;if(state.user){try{await load()}catch(e){toast(e.message)}}}catch(e){toast("Database connection is unavailable.");console.error(e)}}boot();
</script>
